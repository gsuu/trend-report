name: Daily News Fetch

on:
  schedule:
    # 매일 오전 9시 KST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch service news
        run: npm run fetch:service
        continue-on-error: true

      - name: Fetch design news
        run: npm run fetch:design
        continue-on-error: true

      - name: Fetch dev news
        run: npm run fetch:dev
        continue-on-error: true

      - name: Commit collected articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/
          if git diff --cached --quiet; then
            echo "No new articles to commit"
          else
            DATE=$(date -u '+%Y-%m-%d')
            git commit -m "chore: daily news fetch $DATE"
            git push
          fi
