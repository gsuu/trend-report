name: Weekly Trend Collection

# 자동 실행 비활성화 (CLAUDE.md 절대 규칙 #1 — 자동 발송 OFF).
# 이 워크플로는 자동 newsletter 발송 단계를 포함하므로 cron trigger를 제거.
# 수동 실행이 필요하면 workflow_dispatch로 실행. 자동 schedule 복구 전에
# - scripts/collect/index.mjs의 p-limit 의존성 (package.json 누락)
# - "Send newsletter" 단계가 의도된 발송 흐름인지
# 둘 다 검토 필요.
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Collect trends (Stage 1+2)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/collect/index.mjs

      - name: Commit data
        id: commit
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@cttd.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "[commit] 변경사항 없음"
          else
            git commit -m "data: $(date -u +'%Y-W%V') 주간 트렌드 갱신"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send newsletter
        if: steps.commit.outputs.changed == 'true'
        env:
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          SMTP_SECURE:    ${{ secrets.SMTP_SECURE }}
          MAIL_FROM:      ${{ secrets.MAIL_FROM }}
          MAIL_SITE_URL:  ${{ secrets.MAIL_SITE_URL }}
        run: node scripts/collect/notify.mjs
