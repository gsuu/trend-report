name: Weekly Shortlist to Slack

# 매주 월요일 오전 10시 KST (01:00 UTC) 에 매니저 채널로 shortlist 전송
# 수동 실행: workflow_dispatch
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

env:
  # GitHub Actions JS 런타임을 Node.js 24로 강제 (2026-06 이후 deprecated 대비)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-shortlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Send shortlist to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MANAGER_CHANNEL: ${{ secrets.SLACK_MANAGER_CHANNEL }}
        run: node scripts/slack/send-shortlist.mjs
