name: Weekly News Fetch

on:
  schedule:
    # 매주 목요일 오전 8시 KST (수요일 23:00 UTC)
    - cron: '0 23 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch service news
        run: npm run fetch:service
        continue-on-error: true

      - name: Fetch design news
        run: npm run fetch:design
        continue-on-error: true

      - name: Fetch dev news
        run: npm run fetch:dev
        continue-on-error: true

      - name: Commit collected articles
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/
          if git diff --cached --quiet; then
            echo "No new articles to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d')
            git commit -m "chore: weekly news fetch $DATE"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "date=$DATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on completion
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MANAGER_CHANNEL: ${{ secrets.SLACK_MANAGER_CHANNEL }}
          JOB_STATUS: ${{ job.status }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ "$COMMITTED" = "true" ]; then
            TEXT="✅ *주간 뉴스 수집 완료* (목 8시)\n• 새 후보가 \`runs/\`에 커밋됐어요.\n• 워크플로: <$RUN_URL|run 로그>"
          elif [ "$JOB_STATUS" = "success" ]; then
            TEXT="ℹ️ *주간 뉴스 수집 완료* (목 8시)\n• 새로 커밋된 후보는 없었어요.\n• 워크플로: <$RUN_URL|run 로그>"
          else
            TEXT="⚠️ *주간 뉴스 수집 실패* (목 8시)\n• 로그를 확인해 주세요: <$RUN_URL|run 로그>"
          fi
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(printf '{"channel":"%s","text":"%s"}' "$SLACK_MANAGER_CHANNEL" "$TEXT")"
