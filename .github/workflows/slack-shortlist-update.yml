name: Update Shortlist from Slack

# api/slack-interaction.js (Vercel 함수) 가 매니저의 "확정" 버튼 클릭 시 트리거.
# 수동 실행도 가능 (GitHub Actions UI 에서 직접 입력).
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'shortlist 날짜 (YYYY-MM-DD)'
        required: true
      excluded_items:
        description: '제외할 항목 번호 (쉼표 구분, 예: 2,5,8)'
        required: false
        default: ''
      added_items:
        description: '추가 항목 JSON 배열 (예: [{"url":"...","title":"...","category":"SERVICE"}])'
        required: false
        default: '[]'
      moved_items:
        description: '카테고리 이동 JSON 배열 (예: [{"num":5,"to":"DEV"}])'
        required: false
        default: '[]'
      slack_channel:
        description: '완료 후 후속 알림을 보낼 Slack 채널 ID (비우면 알림 안 함)'
        required: false
        default: ''
      slack_message_ts:
        description: '후속 알림을 달 원본 메시지 ts (비우면 알림 안 함)'
        required: false
        default: ''

env:
  # GitHub Actions JS 런타임을 Node.js 24로 강제 (2026-06 이후 deprecated 대비)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-shortlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Apply manager review
        env:
          DATE: ${{ inputs.date }}
          EXCLUDED_ITEMS: ${{ inputs.excluded_items }}
          ADDED_ITEMS: ${{ inputs.added_items }}
          MOVED_ITEMS: ${{ inputs.moved_items }}
        run: node scripts/slack/update-shortlist.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 스킵"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 슬랙 매니저 검토 반영 (${{ inputs.date }})"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack thread
        if: ${{ inputs.slack_channel != '' && inputs.slack_message_ts != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          SLACK_TS: ${{ inputs.slack_message_ts }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPO: ${{ github.repository }}
          DATE: ${{ inputs.date }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/slack/notify-update-result.mjs
